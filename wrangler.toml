name = "pisec"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "pisec"
# `npx wrangler d1 create pisec` で表示される database_id に置き換える
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
